# Shared security headers for all SwisDex server blocks.
# Include with:  include /etc/nginx/snippets/security-headers.conf;
# (or relative path under /etc/nginx).
#
# `always` is required so headers are emitted on error responses too.

# HSTS — 1 year, include subdomains, preload-eligible. Only safe behind
# Cloudflare-Origin TLS that already terminates HTTPS for the user.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

# Clickjacking
add_header X-Frame-Options "SAMEORIGIN" always;

# MIME sniffing
add_header X-Content-Type-Options "nosniff" always;

# Referrer leakage
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# Disable powerful browser features we don't use (geolocation, mic, camera, etc.)
add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;

# Cross-origin isolation (safe defaults — relax per-route if a 3rd party embed breaks)
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-site" always;

# Content Security Policy.
# Notes:
#   * 'unsafe-inline' on script-src is required for Next.js inline runtime
#     bootstrap. Replace with hashes/nonces if you can wire them up.
#   * connect-src includes wss for the trader's price + trade WebSockets.
#   * frame-src 'self' https://accounts.google.com — Google sign-in iframe.
#   * frame-src https://www.tradingview.com — TradingView chart embed.
add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; img-src 'self' data: blob: https:; font-src 'self' data: https://fonts.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://accounts.google.com https://*.tradingview.com https://s3.tradingview.com; connect-src 'self' https: wss:; frame-src 'self' https://accounts.google.com https://*.tradingview.com; frame-ancestors 'self'; form-action 'self'; upgrade-insecure-requests" always;
