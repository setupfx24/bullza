# ============================================================
# Broker platform — Production overrides
# Usage: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# ⚠️  Volumes/containers/networks are namespaced by the compose project
# name — renaming it on an existing deployment orphans the old volumes.
# See the header of docker-compose.yml before changing `name:`.
# ============================================================
name: broker

services:
  # ── Infrastructure — restart policy only (no host ports needed) ──
  postgres:
    restart: always

  timescaledb:
    restart: always

  redis:
    restart: always

  # zookeeper / kafka / kafka-ui removed (see docker-compose.yml note).

  # ── Backend services — restart policy + localhost-only ports ──
  admin-api:
    ports:
      - "127.0.0.1:8003:8001"
    restart: always
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8001", "--workers", "2"]

  gateway:
    ports:
      - "127.0.0.1:8002:8000"
    restart: always
    environment:
      # Replace example.com with the tenant domain (or set in .env and use ${...}).
      CORS_ORIGINS: ${CORS_ORIGINS:-https://example.com,https://trade.example.com,https://admin.example.com}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-.example.com}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      # Mobile app stores its own tokens (no cookies), so it needs the
      # refresh token returned in the login JSON body. The web app keeps
      # using the httpOnly cookie regardless. Without this the mobile app
      # errors "gateway did not return a refresh token".
      JWT_INCLUDE_REFRESH_IN_JSON: "true"
    command: ["uvicorn", "services.gateway.src.main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "2"]

  market-data:
    restart: always

  b-book-engine:
    restart: always

  risk-engine:
    restart: always

  # ── Frontends — build with production domain + restart ──────
  trader-frontend:
    build:
      context: ./frontend/trader
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_APP_VERSION: ${APP_VERSION:-production}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-wss://api.example.com}
        # White-label branding — baked into the bundle at build time (see lib/brand.ts).
        NEXT_PUBLIC_BRAND_NAME: ${NEXT_PUBLIC_BRAND_NAME:-}
        NEXT_PUBLIC_BRAND_SLUG: ${NEXT_PUBLIC_BRAND_SLUG:-}
        NEXT_PUBLIC_BRAND_DOMAIN: ${NEXT_PUBLIC_BRAND_DOMAIN:-}
        NEXT_PUBLIC_BRAND_LOGO: ${NEXT_PUBLIC_BRAND_LOGO:-}
        NEXT_PUBLIC_BRAND_SUPPORT_EMAIL: ${NEXT_PUBLIC_BRAND_SUPPORT_EMAIL:-}
        # Marketing/app host split intentionally UNSET: with both hosts unset the
        # middleware no-ops and the whole app (marketing + dashboard + terminal)
        # is served from one origin (the apex domain). This is required for the PWA —
        # a single origin lets the installed app contain the terminal instead of
        # redirecting to the trade subdomain and breaking out of standalone.
        # The trade subdomain keeps working as a full alias. (client 2026-07-21)
        # Baked into the bundle at build time so the Google Sign-In button can render.
        # Same value as backend GOOGLE_CLIENT_ID. Leave blank to hide the button.
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_CLIENT_ID:-}
        # WalletConnect (Reown Cloud) project id for RainbowKit. Without it,
        # only browser-injected wallets (MetaMask, OKX) work; the WalletConnect
        # mobile-deeplink path (Trust Wallet etc.) is disabled.
        NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID: ${NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID:-}
        # Cloudflare Turnstile site key (PUBLIC). Baked into the bundle at
        # build time so the widget can render on /auth/register. The matching
        # SECRET goes to the gateway env (CLOUDFLARE_TURNSTILE_SECRET_KEY)
        # — never expose it to the browser.
        NEXT_PUBLIC_CLOUDFLARE_TURNSTILE_SITE_KEY: ${NEXT_PUBLIC_CLOUDFLARE_TURNSTILE_SITE_KEY:-}
        # Support quick-contact channels rendered on /support above the
        # ticket list. Either may be empty — the button hides if so.
        NEXT_PUBLIC_SUPPORT_EMAIL: ${NEXT_PUBLIC_SUPPORT_EMAIL:-}
        NEXT_PUBLIC_SUPPORT_WHATSAPP: ${NEXT_PUBLIC_SUPPORT_WHATSAPP:-}
    ports:
      - "127.0.0.1:3012:3000"
    environment:
      INTERNAL_API_URL: http://gateway:8000/api/v1
      TRADER_API_PROXY_TARGET: http://gateway:8000
      # Browser WebSocket connects directly to api subdomain
      NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-wss://api.example.com}
      # NEXT_PUBLIC_MARKETING_HOST / NEXT_PUBLIC_TRADE_HOST intentionally unset —
      # single-origin app for the PWA (see build args note above).
      # DO NOT set NEXT_PUBLIC_GATEWAY_URL — browser uses same-origin /api/v1 proxy (avoids CORS)
    restart: always

  admin-frontend:
    build:
      context: ./frontend/admin
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:3013:3001"
    environment:
      ADMIN_API_PROXY_TARGET: http://admin-api:8001
    restart: always
